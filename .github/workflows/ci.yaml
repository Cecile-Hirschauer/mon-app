name: CI & CD Matrix

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11-slim", "3.12-slim"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Génère des tags spécifiques à chaque version testée
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=-py${{ matrix.python-version }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # Build avec passage de l'argument de version et export tar
      - name: Build image and export to tar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=/tmp/image-${{ matrix.python-version }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Test rapide : vérification que le conteneur démarre
      - name: Test container startup
        run: |
          docker load --input /tmp/image-${{ matrix.python-version }}.tar
          PRIMARY_TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n 1)
          docker run --rm -d --name test-app "$PRIMARY_TAG"
          sleep 3
          docker ps | grep test-app
          docker stop test-app

      # Sauvegarde de l'artefact spécifique à la version
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.python-version }}
          path: /tmp/image-${{ matrix.python-version }}.tar
          retention-days: 1

  push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    steps:
      # Télécharge tous les artefacts d'images générés par la matrix
      - name: Download all Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          path: /tmp/images
          merge-multiple: true

      # Chargement de toutes les images exportées
      - name: Load images into Docker
        run: |
          for tar in /tmp/images/*.tar; do
            echo "Chargement de $tar..."
            docker load --input "$tar"
          done
          docker image ls -a

      # Authentification GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push de tous les tags sur GHCR
      - name: Push all Docker images to GHCR
        run: |
          REPO_IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          docker images --format "{{.Repository}}:{{.Tag}}" | grep "^${REPO_IMAGE}" | while read -r tag; do
            echo "Pushing $tag..."
            docker push "$tag"
          done