name: CI & CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11-slim", "3.12-slim"]

    steps:
      # Obligatoire : l'action composite locale n'existe sur le runner qu'après checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Appel de l'action composite locale
      - name: Build and export image via composite action
        uses: ./.github/actions/build-image
        with:
          image-tag: mon-app:${{ matrix.python-version }}
          tar-path: /tmp/mon-app-${{ matrix.python-version }}.tar
          python-version: ${{ matrix.python-version }}

      # Test rapide d'exécution du conteneur
      - name: Test container startup
        run: |
          docker run --rm -d --name test-app mon-app:${{ matrix.python-version }}
          sleep 3
          docker ps | grep test-app
          docker stop test-app

      # Sauvegarde de l'artefact pour les jobs suivants (push, scan, tests...)
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-${{ matrix.python-version }}
          path: /tmp/mon-app-${{ matrix.python-version }}.tar
          retention-days: 1

  push-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name != 'pull_request'

    steps:
      - name: Download all Docker image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: docker-image-*
          path: /tmp/images
          merge-multiple: true

      - name: Load images into Docker
        run: |
          for tar in /tmp/images/*.tar; do
            echo "Chargement de $tar..."
            docker load --input "$tar"
          done
          docker image ls -a

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push to GHCR
        run: |
          REPO_LOWER="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          for py_ver in "3.11-slim" "3.12-slim"; do
            docker tag mon-app:${py_ver} ${REPO_LOWER}:${py_ver}
            docker push ${REPO_LOWER}:${py_ver}
          done